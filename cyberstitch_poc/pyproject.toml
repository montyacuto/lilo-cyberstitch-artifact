[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberstitch-poc"
version = "0.1.0"
description = "Validation-first CyberSTITCH proof of concept for RECE-style LILO extension work."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cyberstitch = "cyberstitch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cyberstitch*"]
