# Interim LiteLLM proxy config for initial LILO reruns.
#
# This intentionally routes the paper-era model names to the dated GPT-3.5
# Turbo snapshot observed during the reproduction, avoiding undated alias drift.
#
# Run LiteLLM outside the Python 3.7 LILO conda environment, then point LILO at
# the OpenAI-compatible proxy:
#
#   export LILO_OPENAI_API_BASE=http://127.0.0.1:4000/v1
#   export OPENAI_API_KEY="$LITELLM_MASTER_KEY"
#   source scripts/env_litellm_gpt35.sh
#
# The proxy process uses LITELLM_OPENAI_API_KEY for the upstream OpenAI key.

model_list:
  - model_name: code-davinci-002
    litellm_params:
      model: openai/gpt-3.5-turbo-0125
      api_key: os.environ/LITELLM_OPENAI_API_KEY

  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo-0125
      api_key: os.environ/LITELLM_OPENAI_API_KEY

  - model_name: gpt-3.5-turbo-0125
    litellm_params:
      model: openai/gpt-3.5-turbo-0125
      api_key: os.environ/LITELLM_OPENAI_API_KEY

  - model_name: gpt-3.5-turbo-0301
    litellm_params:
      model: openai/gpt-3.5-turbo-0125
      api_key: os.environ/LITELLM_OPENAI_API_KEY

  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-3.5-turbo-0125
      api_key: os.environ/LITELLM_OPENAI_API_KEY

  - model_name: gpt-4-0314
    litellm_params:
      model: openai/gpt-3.5-turbo-0125
      api_key: os.environ/LITELLM_OPENAI_API_KEY

  - model_name: text-embedding-ada-002
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/LITELLM_OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
